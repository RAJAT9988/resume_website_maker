<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-field="basics.name">Your Name</title>
  </head>
  <body>
    <header class="header">
      <div class="headerInner">
        <div class="avatarWrap">
          <img class="avatar" data-field="basics.photo" alt="Profile photo" />
          <div class="avatarPlaceholder" data-field="basics.photoPlaceholder">You</div>
        </div>
        <div class="headerText">
          <h1 class="name" data-field="basics.name">Your Name</h1>
          <p class="headline" data-field="basics.headline">Your headline</p>
          <p class="meta">
            <span data-field="basics.location">Location</span>
            <span class="sep">·</span>
            <a href="mailto:" data-field="basics.email">email@example.com</a>
            <span class="sep">·</span>
            <span data-field="basics.phone">Phone</span>
          </p>
          <div class="links">
            <a class="linkBtn" data-field="links.website" data-attr="href" href="#">Website</a>
            <a class="linkBtn outline" data-field="links.linkedin" data-attr="href" href="#">LinkedIn</a>
            <a class="linkBtn outline" data-field="links.github" data-attr="href" href="#">GitHub</a>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <section id="about" class="section">
        <h2 class="sectionTitle">About</h2>
        <p class="sectionText" data-field="about.bio">About you.</p>
      </section>

      <section id="skills" class="section">
        <h2 class="sectionTitle">Skills</h2>
        <div class="chips" data-repeat="skills"></div>
      </section>

      <section id="projects" class="section">
        <h2 class="sectionTitle">Projects</h2>
        <div class="cards" data-repeat="projects"></div>
      </section>

      <section id="experience" class="section">
        <h2 class="sectionTitle">Experience</h2>
        <div class="timeline" data-repeat="experience"></div>
      </section>

      <section id="contact" class="section">
        <h2 class="sectionTitle">Contact</h2>
        <div class="contactGrid">
          <div class="contactItem">
            <span class="label">Email</span>
            <span data-field="basics.email">email@example.com</span>
          </div>
          <div class="contactItem">
            <span class="label">Phone</span>
            <span data-field="basics.phone">Phone</span>
          </div>
          <div class="contactItem">
            <span class="label">Location</span>
            <span data-field="basics.location">Location</span>
          </div>
        </div>
      </section>

      <footer class="footer">
        © <span data-field="basics.name">Your Name</span>
      </footer>
    </main>
  </body>
</html>
