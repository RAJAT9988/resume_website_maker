<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-field="basics.name">Your Name</title>
  </head>
  <body>
    <aside class="sidebar">
      <div class="avatarWrap">
        <img class="avatar" data-field="basics.photo" alt="Profile photo" />
        <div class="avatarPlaceholder" data-field="basics.photoPlaceholder">You</div>
      </div>
      <h1 class="name" data-field="basics.name">Your Name</h1>
      <p class="headline" data-field="basics.headline">Your headline</p>
      <p class="meta">
        <span data-field="basics.location">Location</span><br>
        <a data-field="basics.email" href="mailto:">email@example.com</a><br>
        <span data-field="basics.phone">Phone</span>
      </p>
      <nav class="sideNav">
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#projects">Projects</a>
        <a href="#experience">Experience</a>
        <a href="#contact">Contact</a>
      </nav>
      <div class="links">
        <a class="linkBtn" data-field="links.website" data-attr="href" href="#">Website</a>
        <a class="linkBtn" data-field="links.github" data-attr="href" href="#">GitHub</a>
        <a class="linkBtn" data-field="links.linkedin" data-attr="href" href="#">LinkedIn</a>
      </div>
    </aside>

    <main class="content">
      <section id="about" class="sec">
        <h2 class="secT">About</h2>
        <p data-field="about.bio">About you.</p>
      </section>

      <section id="skills" class="sec">
        <h2 class="secT">Skills</h2>
        <div class="chips" data-repeat="skills"></div>
      </section>

      <section id="projects" class="sec">
        <h2 class="secT">Projects</h2>
        <div class="cards" data-repeat="projects"></div>
      </section>

      <section id="experience" class="sec">
        <h2 class="secT">Experience</h2>
        <div class="timeline" data-repeat="experience"></div>
      </section>

      <section id="contact" class="sec">
        <h2 class="secT">Contact</h2>
        <div class="contactGrid">
          <div class="contactItem"><span class="muted">Email</span><span data-field="basics.email">email@example.com</span></div>
          <div class="contactItem"><span class="muted">Phone</span><span data-field="basics.phone">Phone</span></div>
          <div class="contactItem"><span class="muted">Location</span><span data-field="basics.location">Location</span></div>
        </div>
      </section>

      <footer class="foot">© <span data-field="basics.name">Your Name</span></footer>
    </main>
  </body>
</html>
